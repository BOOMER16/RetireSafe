name: backend

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Download the real traffic data (checksum-verified)
        run: python scripts/get_data.py
      - name: Test (warnings about implicit text encodings are errors; live DNS/RDAP tests enabled)
        working-directory: backend
        env:
          RETIRESAFE_NETWORK_TESTS: "1"
        run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -q
      - name: Guided demo runs end to end
        run: python demo.py --mode strict
