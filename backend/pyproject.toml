[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retiresafe"
version = "0.1.0"
description = "Evidence-driven pre-flight checks for retiring cloud resources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "dnspython>=2.6",
  "tldextract>=5.1",
  "requests>=2.31",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "boto3>=1.34", "moto[server]>=5.0"]

[project.scripts]
retiresafe = "retiresafe.cli:main"

[tool.setuptools.packages.find]
include = ["retiresafe*"]

[tool.setuptools.package-data]
"retiresafe.knowledge" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs live DNS / S3 access",
  "realdata: needs the research datasets in ../data (NASA-HTTP logs)",
]
