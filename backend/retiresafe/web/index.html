<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>RetireSafe Console</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#/" aria-label="RetireSafe home">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--panel-2)"/><path d="M16 5 7.5 8.4v6.2c0 5.2 3.6 9.5 8.5 10.8 4.9-1.3 8.5-5.6 8.5-10.8V8.4L16 5Z" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M11.5 15.5h3.2M17.3 15.5h3.2" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/></svg>
        <div><b>RetireSafe</b><small>deletion pre-flight</small></div>
      </a>
      <nav class="nav" aria-label="main">
        <span class="label">Review</span>
        <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Change reviews</a>
        <a href="#/new" data-nav="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New assessment</a>
        <a href="#/compare" data-nav="compare"><svg viewBox="0 0 24 24"><path d="M7 4v16M17 4v16M3 8l4-4 4 4M13 16l4 4 4-4"/></svg>Before / after</a>
        <span class="label">Monitor</span>
        <a href="#/scan" data-nav="scan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12 18 6"/></svg>Drift scan</a>
        <span class="label">Reference</span>
        <a href="#/knowledge" data-nav="knowledge"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/></svg>Rules and sources</a>
      </nav>
      <div class="side-foot" id="health"><div class="row"><span><span class="dot"></span>connecting…</span></div></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="top-actions">
          <span id="actions" class="row"></span>
          <button class="btn ghost iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <noscript><p class="content">The RetireSafe console needs JavaScript. The same data is available from the API at <a href="/docs">/docs</a> and from the <code>retiresafe</code> command line.</p></noscript>
</body>
</html>
