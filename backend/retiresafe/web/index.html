<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>RetireSafe Console</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="mast">
    <a class="wordmark" href="#/" aria-label="RetireSafe home"><b>RetireSafe</b><span>Deletion pre‑flight</span></a>
    <nav class="nav" aria-label="main">
      <a href="#/" data-nav="home"><sup>01</sup>Reviews</a>
      <a href="#/new" data-nav="new"><sup>02</sup>New check</a>
      <a href="#/compare" data-nav="compare"><sup>03</sup>Before / after</a>
      <a href="#/scan" data-nav="scan"><sup>04</sup>Drift scan</a>
      <a href="#/knowledge" data-nav="knowledge"><sup>05</sup>Sources</a>
    </nav>
    <div class="mast-r">
      <div class="status" id="health"><span class="dot"></span><span>connecting</span></div>
      <button class="btn ghost iconbtn" id="theme" title="Switch light / dark" aria-label="Switch between light and dark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <div class="sub-bar">
    <div class="crumbs" id="crumbs"></div>
    <div class="actions" id="actions"></div>
  </div>
  <main class="content" id="view" tabindex="-1"></main>
  <footer class="statusbar" id="statusbar" aria-label="status"></footer>
  <noscript><p class="content">The RetireSafe console needs JavaScript. The same data is available from the API at <a href="/docs">/docs</a> and from the <code>retiresafe</code> command line.</p></noscript>
</body>
</html>
